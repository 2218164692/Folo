name: Build Personal iOS IPA

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned personal iOS IPA
    runs-on: macos-latest
    env:
      ANDROID_PACKAGE: ${{ vars.ANDROID_PACKAGE || 'is.follow.personal' }}
      EXPO_OWNER: ${{ vars.EXPO_OWNER }}
      EXPO_PUBLIC_APP_NAME: ${{ vars.EXPO_PUBLIC_APP_NAME || 'Folo Personal' }}
      EXPO_PUBLIC_ENABLE_ABOUT: "0"
      EXPO_PUBLIC_ENABLE_ACCOUNT: "0"
      EXPO_PUBLIC_ENABLE_AI: "0"
      EXPO_PUBLIC_ENABLE_ANALYTICS: "0"
      EXPO_PUBLIC_ENABLE_PAID_SUBSCRIPTION: "0"
      EXPO_PUBLIC_ENABLE_REVIEW_PROMPTS: "0"
      EXPO_PUBLIC_ENABLE_SUPPORT_FEEDBACK: "0"
      EXPO_PUBLIC_ENABLE_TTS: "0"
      EXPO_PUBLIC_ENABLE_UPDATES: "0"
      EXPO_PUBLIC_PERSONAL_BUILD: "1"
      EXPO_SLUG: ${{ vars.EXPO_SLUG || 'folo-personal' }}
      IOS_BUNDLE_IDENTIFIER: ${{ vars.IOS_BUNDLE_IDENTIFIER || 'is.follow.personal' }}
      PROFILE: "personal"
      SENTRY_AUTH_TOKEN: ${{ secrets.RN_SENTRY_AUTH_TOKEN }}
      CI: true
      npm_config_node_linker: isolated
      npm_config_shamefully_hoist: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: ./.github/actions/setup-xcode

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --child-concurrency=1

      - name: Prepare personal native dependencies
        run: node .github/scripts/prepare-personal-ios-native.mjs

      - name: Build mobile web assets
        run: pnpm --dir apps/mobile/web-app build --outDir ../../../out/rn-web/html-renderer

      - name: Prebuild iOS project
        run: pnpm --dir apps/mobile exec expo prebuild --platform ios --clean --non-interactive

      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install --repo-update

      - name: Verify personal native exclusions
        working-directory: apps/mobile
        run: |
          set -euo pipefail

          if ! grep -q "exclude: \['expo-updates'\]" ios/Podfile; then
            echo "expo-updates was not excluded from use_expo_modules! in ios/Podfile"
            exit 1
          fi

          if [ ! -f ios/Pods/Pods.xcodeproj/project.pbxproj ]; then
            echo "Pods.xcodeproj was not generated"
            exit 1
          fi

          if [ -f ios/Podfile.lock ] && grep -En "^[[:space:]]+- EXUpdates([[:space:](]|$)" ios/Podfile.lock; then
            echo "EXUpdates is still present in Podfile.lock"
            exit 1
          fi

          if grep -En "(/EXUpdates/|EXUpdates\\.bundle|name = EXUpdates;|productName = EXUpdates;)" ios/Pods/Pods.xcodeproj/project.pbxproj; then
            echo "EXUpdates is still present in Pods.xcodeproj"
            exit 1
          fi

      - name: Build unsigned iOS app
        working-directory: apps/mobile
        run: |
          set -euo pipefail

          workspace="$(find ios -maxdepth 1 -name "*.xcworkspace" -print -quit)"
          if [ -z "$workspace" ]; then
            echo "No Xcode workspace found under apps/mobile/ios"
            exit 1
          fi

          project="$(find ios -maxdepth 1 -name "*.xcodeproj" ! -name "Pods.xcodeproj" -print -quit)"
          if [ -z "$project" ]; then
            echo "No app Xcode project found under apps/mobile/ios"
            exit 1
          fi

          echo "App project:"
          xcodebuild -list -project "$project"

          scheme="$(
            xcodebuild -list -json -project "$project" \
              | ruby -rjson -e '
                  data = JSON.parse(STDIN.read)
                  project = data["project"] || {}
                  targets = project["targets"] || []
                  schemes = project["schemes"] || []
                  preferred_names = [ENV["EXPO_PUBLIC_APP_NAME"], "Folo", ENV["EXPO_SLUG"]].compact
                  app_target = preferred_names.lazy.map { |name| targets.find { |t| t == name } }.find(&:itself) || targets.first
                  preferred = preferred_names.lazy.map { |name| schemes.find { |s| s == name } }.find(&:itself) || schemes.find { |s| s == app_target } || app_target
                  abort "No Xcode scheme found" unless preferred
                  puts preferred
                '
          )"
          echo "Using Xcode scheme: $scheme"

          derived_data_path="$PWD/build/DerivedData"
          rm -rf "$derived_data_path" "$PWD/Payload" "$PWD/build-personal-unsigned.ipa"
          mkdir -p "$PWD/build"

          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$derived_data_path" \
            clean build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

          products_path="$derived_data_path/Build/Products"
          app_path="$(
            find "$products_path" \
              -type d \
              -name "*.app" \
              ! -name "*Tests.app" \
              ! -name "*UITests.app" \
              ! -path "*/Debug-iphonesimulator/*" \
              ! -path "*/Release-iphonesimulator/*" \
              -print -quit
          )"
          if [ -z "$app_path" ]; then
            echo "No .app found in build products"
            echo "Build products:"
            find "$products_path" -maxdepth 4 -print
            exit 1
          fi
          echo "Packaging app: $app_path"

          mkdir -p Payload
          cp -R "$app_path" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload build-personal-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: folo-personal-ios-unsigned
          path: apps/mobile/build-personal-unsigned.ipa
          retention-days: 90
